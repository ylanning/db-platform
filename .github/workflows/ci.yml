name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGION: europe-west2
  SERVICE_NAME: dbp-control-plane
  REPOSITORY: dbp-control-plane

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry install
      - name: Lint code
        run: poetry run ruff check .
      - name: Run tests
        run: poetry run pytest

  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Terraform plan
        run: |
          terraform -chdir=infra plan \
            -var project_id="${{ secrets.GCP_PROJECT_ID }}" \
            -var instance_id="${{ secrets.CLOUDSQL_INSTANCE_ID }}" \
            -var backup_bucket="${{ secrets.BACKUP_BUCKET }}" \
            -var cloud_run_image="placeholder"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform -chdir=infra fmt -check

      - name: Terraform validate
        run: terraform -chdir=infra validate

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE -f docker/Dockerfile .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Terraform apply
        run: |
          terraform -chdir=infra init
          terraform -chdir=infra apply -auto-approve \
            -var project_id="${{ secrets.GCP_PROJECT_ID }}" \
            -var instance_id="${{ secrets.CLOUDSQL_INSTANCE_ID }}" \
            -var backup_bucket="${{ secrets.BACKUP_BUCKET }}" \
            -var cloud_run_image="$IMAGE"
