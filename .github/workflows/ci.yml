name: CI/CD Pipeline

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
          python-version: '3.13'
    - name: Install poetry
      run: pip install poetry==1.8.3
    - name: Install dependencies
      run: poetry install
    - name: Lint code
      run: poetry run ruff check .
    - name: Run tests
      run: poetry run pytest
